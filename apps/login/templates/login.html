{% extends 'base-login.html' %}
{% block title %}Login | Sus
{% endblock %}
{% load static %}
{% block content %}
    <div class="container mt-5 d-flex vh-100 align-items-center justify-content-center">
            <div class="row">
                <figure class="d-flex justify-content-center mb-3">
                    <img src="{% static 'img/logo.png' %}" alt="logo" width="200" class="img-logo img-fluid">
                </figure>
                <h1 class="nome-hospital d-flex justify-content-center mb-5"> 
                    Hospital<br>Ultimo Suspiro</h1>
                <div class="d-flex justify-content-center col-12">
                <form action="" method="POST">
                    <div class="col-12">
                        <label for="username" class="form-label">
                            Usuário:
                        </label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    <div class="col-12">
                        <label for="password" class="form-control" name="password">
                            Senha:
                        </label>
                        <input type="password" class="form-control" name="password" required>
                        <div class="d-flex justify-content-center mt-5">
                            <button type="submit" class="btn btn-success col-4">
                                Entrar
                            </button>
                        </div>
                        <p class="mt-3">Não possui cadastro? <a href="novoUsuario/">Cadastre-se</a>.</p>
                    </div>
                </form>
            </div>
        </div>

    </div>
{% endblock %}
