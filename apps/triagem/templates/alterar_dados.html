{% extends 'base-triagem.html' %}
{% block title %}Alterar Dados do Paciente{% endblock %}
{% block content %}
    <div class="container vh-100">
        <h1 class="mt-5">
            Alterar Dados do Paciente
        </h1>
        <hr>
        {% if error %}<p>{{ error }}</p>{% endif %}
        <form action="{% url 'alterar_dados' paciente.codigo_paciente %}" method="POST">
            {% csrf_token %}
            <div class="col-12">
                        <label for="nome" class="form-label">
                            Nome:
                        </label>
                        <input type="text" class="form-control" name="nome" value="{{ paciente.nome }}" required>
                    </div>
                    <div class="col-12">
                        <label for="cpf" class="form-control" name="cpf">
                            CPF:
                        </label>
                         <input type="cpf" class="form-control" name="cpf" value="{{ paciente.cpf }}" required>
                    </div>
                    <div class="col-12">
                        <label for="data_nascimento" class="form-control">
                            Data de Nascimento:
                        </label>
                         <input type="date" class="form-control" name="data_nascimento" value="{{ paciente.data_nascimento|date:'Y-m-d' }}" required>
                    </div>
                     <div class="col-12">
                        <label for="sintomas" class="form-control" name="sintomas">
                            Sintomas:
                        </label>
                         <textarea type="text" class="form-control" name="sintomas" required>
                            {{paciente.sintomas}}
                        </textarea>
                    </div>
                    <div class="mt-4">
                <button type="submit" class="btn btn-primary">Alterar dados</button>
            </div>
        </form>
    </div>

{% endblock %}
