{% extends 'base-triagem.html' %}
{% block title %}Cadastrar Novo Paciente{% endblock %}
{% block content %}
    <div class="container vh-100">
        <h1 class="mt-5">
            Cadastrar Novo Paciente
        </h1>
        <hr>
        {% if error %}<p>{{ error }}</p>{% endif %}
        <form action="" method="POST">
            {% csrf_token %}
            <div class="col-12">
                        <label for="nome" class="form-label">
                            Nome:
                        </label>
                        <input type="text" class="form-control" name="nome" required>
                    </div>
                    <div class="col-12">
                        <label for="cpf" class="form-control" name="cpf">
                            CPF:
                        </label>
                         <input type="cpf" class="form-control" name="cpf" required>
                    </div>
                    <div class="col-12">
                        <label for="data" class="form-control" name="data">
                            Data de Nascimento:
                        </label>
                         <input type="datetime" class="form-control" name="data" required>
                    </div>
                     <div class="col-12">
                        <label for="sintomas" class="form-control" name="sintomas">
                            Sintomas:
                        </label>
                         <input type="text" class="form-control" name="sintomas" required>
                    </div>
        </form>
    </div>

{% endblock %}
